# Push-gate pins (bennett/tools/gate_README.md). Siblings resolve only to these commits.
schema = 1
repo = "bennett-vm"
tool_sha = "822aaeffab369114e1a719a7b887a0192b22d386"
timeout_s = 14400

# Paths no check reads; changing only these reuses a PASS receipt (bennett/tools/gate_README.md).
[receipt]
non_product = [".beads/", "worklog/", "CLAUDE.md", "AGENTS.md"]

[env]
CARGO_TARGET_DIR = "{root}/.tmp/gate-target"
BENNETT_ISA_SPEC = "{sibling:bennett-isa-spec}"
BENNETT_BATCH_ISA_SPEC = "{sibling:bennett-batch-reference}"

[[check]]
name = "cargo test"
argv = ["cargo", "test", "--offline", "-j3", "--", "--test-threads=4"]

[[check]]
name = "slow and published-oracle tests"
tier = "post-merge"  # long tail: main-health runs --tier full after landing
argv = ["cargo", "test", "--offline", "-j3", "--", "--ignored", "--test-threads=4"]

[[check]]
name = "quality baseline"
argv = ["python3", "scripts/quality.py"]

[siblings."bennett-isa-spec"]
sha = "220f4e4dd9ea13cf81f3c28651219710897cd79d"
note = "Published explicit accuracy and legacy E_ESTIMATE_ACCURACY_REQUIRED policy"

[[siblings."bennett-isa-spec".build]]
name = "reference interpreter (debug)"
cwd = "reference-interpreter"
argv = ["cargo", "build", "--offline"]
outputs = ["reference-interpreter/target/debug/bennett-isa-ref"]
env = { CARGO_BUILD_JOBS = "3" }

[[siblings."bennett-isa-spec".build]]
name = "published conformance harness (debug)"
cwd = "conformance"
argv = ["cargo", "build", "--offline"]
outputs = ["conformance/target/debug/bennett-isa-conformance"]
env = { CARGO_BUILD_JOBS = "3" }


[siblings."bennett-batch-reference"]
repo = "bennett-isa-spec"
sha = "c3df1d32f1ad3139dc863a90085604061ef483de"
note = "Accepted main batch CLI/interface; independent from VM catalog/contract migration"

[[siblings."bennett-batch-reference".build]]
name = "batch reference CLI (release)"
cwd = "reference-interpreter"
argv = ["cargo", "build", "--offline", "--release", "-j3"]
outputs = ["reference-interpreter/target/release/bennett-isa-ref"]
