[package]
name = "bennett-vm"
version = "0.1.0"
edition = "2024"
autotests = false

[features]
# Select the C provider family at build time; the default preserves old binaries.
abi-0-9 = []

[dependencies]
sha2 = "0.10.9"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[[test]]
name = "suite"
path = "tests/suite.rs"

[profile.test]
debug = "line-tables-only"
