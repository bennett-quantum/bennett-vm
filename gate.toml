# Push-gate pins (bennett/tools/gate_README.md). Siblings resolve only to these commits.
schema = 1
repo = "bennett-vm"
tool_sha = "01c0314c9aaa4a37313ab530da2134efafe9cbd5"
timeout_s = 14400

[env]
CARGO_TARGET_DIR = "{root}/.tmp/gate-target"
BENNETT_ISA_SPEC = "{sibling:bennett-isa-spec}"

[[check]]
name = "cargo test"
argv = ["cargo", "test", "--offline", "-j3", "--", "--test-threads=4"]

[[check]]
name = "slow and published-oracle tests"
argv = ["cargo", "test", "--offline", "-j3", "--", "--ignored", "--test-threads=4"]

[siblings."bennett-isa-spec"]
sha = "fd626d37aba1f719c3b7b2059be46cbfaf462886"
note = "ISA main with published K83 fixtures and accepted ISA 0.9 repairs (shift 4)"

[[siblings."bennett-isa-spec".build]]
name = "reference interpreter (debug)"
cwd = "reference-interpreter"
argv = ["cargo", "build", "--offline"]
outputs = ["reference-interpreter/target/debug/bennett-isa-ref"]
env = { CARGO_BUILD_JOBS = "4" }

[[siblings."bennett-isa-spec".build]]
name = "published conformance harness (debug)"
cwd = "conformance"
argv = ["cargo", "build", "--offline"]
outputs = ["conformance/target/debug/bennett-isa-conformance"]
env = { CARGO_BUILD_JOBS = "4" }

